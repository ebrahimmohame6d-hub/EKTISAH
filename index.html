<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام الشحنات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --blue:#213d7b; --orange:#ec6821; --bg:#eef1f5; --err:#b91c1c; --ok:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Cairo,Tahoma,sans-serif; background:var(--bg); color:#222; }
  header { background:var(--blue); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:1100px; margin:20px auto; padding:0 14px; }
  .card { background:#fff; border-radius:10px; padding:18px; margin-bottom:18px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  h2 { font-size:17px; margin:0 0 12px; color:var(--blue); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  .full { grid-column:1/-1; }
  label { display:block; font-size:13px; margin-bottom:4px; color:#555; }
  input, select, textarea { width:100%; padding:9px; border:1px solid #cbd5e1; border-radius:6px; font:inherit; background:#fff; }
  button { background:var(--blue); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; cursor:pointer; }
  button.secondary { background:#64748b; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { margin-top:10px; font-size:14px; min-height:18px; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  .cost { font-weight:700; color:var(--orange); margin-inline-start:10px; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px; border-bottom:1px solid #e2e8f0; text-align:right; }
  th { background:#f8fafc; color:#334155; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<header>
  <h1>نظام الشحنات</h1>
  <div id="userbox" class="hidden">
    <span id="username"></span>
    <button class="secondary" id="logoutBtn">خروج</button>
  </div>
</header>

<main>
  <!-- شاشة الدخول -->
  <section id="loginView" class="card hidden">
    <h2>تسجيل الدخول</h2>
    <div class="grid">
      <div><label for="u">اسم المستخدم</label><input id="u" autocomplete="username"></div>
      <div><label for="p">الباسورد</label><input id="p" type="password" autocomplete="current-password"></div>
    </div>
    <p><button id="loginBtn">دخول</button></p>
    <div id="loginMsg" class="msg"></div>
  </section>

  <!-- شاشة التطبيق -->
  <div id="appView" class="hidden">
    <section class="card">
      <h2>إضافة شحنة</h2>
      <form id="addForm">
        <div class="grid">
          <div><label>اسم العميل</label><input name="customer_name" required></div>
          <div><label>موبايل العميل</label><input name="phone" inputmode="numeric" required></div>
          <div><label>المنطقة</label><select name="area_id" id="areas" required></select></div>
          <div><label>الوزن (كجم)</label><input name="weight" type="number" min="0" step="0.1" value="1" required></div>
          <div class="full"><label>العنوان</label><input name="address" required></div>
          <div class="full"><label>ملاحظات</label><textarea name="notes" rows="2"></textarea></div>
        </div>
        <p>
          <button type="button" id="calcBtn" class="secondary">احسب التكلفة</button>
          <span id="costPreview" class="cost"></span>
        </p>
        <p><button type="submit" id="saveBtn">حفظ الشحنة</button></p>
        <div id="addMsg" class="msg"></div>
      </form>
    </section>

    <section class="card">
      <h2>آخر الشحنات</h2>
      <p><button class="secondary" id="reloadBtn">تحديث</button></p>
      <div style="overflow-x:auto">
        <table>
          <thead>
            <tr><th>العميل</th><th>الموبايل</th><th>المنطقة</th><th>الوزن</th><th>التكلفة</th><th>الحالة</th><th>التاريخ</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div id="listMsg" class="msg"></div>
    </section>
  </div>
</main>

<script>
  // ضع رابط الـ Web App بتاع Apps Script هنا
  const API_URL = 'PUT_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';

  let token = sessionStorage.getItem('token') || '';

  const $ = (id) => document.getElementById(id);

  function setMsg(id, text, ok = false) {
    const el = $(id);
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  // كل الطلبات POST بـ text/plain عشان نتفادى مشاكل CORS مع Apps Script
  async function api(action, data = {}) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, token, ...data })
    });
    const json = await res.json();
    if (json.status !== 'success') throw new Error(json.message || 'حصل خطأ');
    return json;
  }

  function showApp(loggedIn) {
    $('loginView').classList.toggle('hidden', loggedIn);
    $('appView').classList.toggle('hidden', !loggedIn);
    $('userbox').classList.toggle('hidden', !loggedIn);
  }

  function handleError(e, msgId) {
    if (e.message && e.message.includes('انتهت الجلسة')) {
      forceLogout();
      setMsg('loginMsg', e.message);
    } else {
      setMsg(msgId, e.message);
    }
  }

  function forceLogout() {
    token = '';
    sessionStorage.removeItem('token');
    showApp(false);
  }

  async function loadAreas() {
    const r = await api('areas');
    const sel = $('areas');
    sel.innerHTML = '';
    const first = document.createElement('option');
    first.value = '';
    first.textContent = 'اختار المنطقة';
    sel.appendChild(first);
    r.areas.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      sel.appendChild(opt);
    });
  }

  async function loadList() {
    try {
      const r = await api('list', { limit: 50 });
      const tb = $('rows');
      tb.innerHTML = '';
      r.shipments.forEach(s => {
        const tr = document.createElement('tr');
        const values = [
          s.customer_name, s.phone, s.area_name, s.weight, s.cost, s.status,
          s.created_at ? new Date(s.created_at).toLocaleString('ar-EG') : ''
        ];
        values.forEach(v => {
          const td = document.createElement('td');
          td.textContent = v ?? '';
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
      setMsg('listMsg', r.shipments.length ? '' : 'مفيش شحنات لسه');
    } catch (e) {
      handleError(e, 'listMsg');
    }
  }

  $('loginBtn').onclick = async () => {
    try {
      const r = await api('login', { username: $('u').value, password: $('p').value });
      token = r.token;
      sessionStorage.setItem('token', token);
      $('p').value = '';
      $('username').textContent = r.username;
      showApp(true);
      await loadAreas();
      await loadList();
    } catch (e) {
      setMsg('loginMsg', e.message);
    }
  };

  $('logoutBtn').onclick = async () => {
    try { await api('logout'); } catch (e) { /* لو الجلسة خلصت أصلاً */ }
    forceLogout();
  };

  $('calcBtn').onclick = async () => {
    const f = $('addForm');
    try {
      const r = await api('calc', { area_id: f.area_id.value, shipment_weight: f.weight.value });
      $('costPreview').textContent = 'التكلفة: ' + r.total + ' EGP';
    } catch (e) {
      $('costPreview').textContent = '';
      handleError(e, 'addMsg');
    }
  };

  $('addForm').onsubmit = async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    const data = Object.fromEntries(new FormData(f));
    $('saveBtn').disabled = true;
    try {
      const r = await api('add', data);
      setMsg('addMsg', 'تم حفظ الشحنة. التكلفة: ' + r.total + ' EGP', true);
      f.reset();
      f.weight.value = 1;
      $('costPreview').textContent = '';
      await loadList();
    } catch (e) {
      handleError(e, 'addMsg');
    } finally {
      $('saveBtn').disabled = false;
    }
  };

  $('reloadBtn').onclick = loadList;

  // أول تحميل: لو فيه جلسة محفوظة نفتح التطبيق مباشرة
  (async () => {
    if (!token) { showApp(false); return; }
    showApp(true);
    try {
      await loadAreas();
      await loadList();
    } catch (e) {
      handleError(e, 'listMsg');
    }
  })();
</script>
</body>
</html>
